# Optional: move this file to .github/workflows/cubicle-latest.yml to refresh Cubicle's "Latest" shelf daily.
# It runs scripts/cubicle/08_latest.py (public upload RSS feeds + oEmbed, no API key needed) and commits
# data/cubicle/latest.json (the site build copies it into the app). If YT_API_KEY is set as a repository secret it
# is used for the upload lists instead of RSS (a few quota units per channel).
name: Refresh Cubicle latest

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build latest shelf
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/cubicle/08_latest.py --days 45
      - name: Commit if changed
        run: |
          git config user.name "cubicle-bot"
          git config user.email "cubicle-bot@users.noreply.github.com"
          git add data/cubicle/latest.json
          git diff --cached --quiet || (git commit -m "Refresh Cubicle latest" && git push)
